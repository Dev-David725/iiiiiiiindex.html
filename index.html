<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة عمليات الأدمن - انتخابات حدائق القبة</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 950px;
            margin: auto;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid rgba(206, 17, 38, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .egypt-flag-bar {
            height: 6px;
            width: 100%;
            background: linear-gradient(to right, #ce1126 33.33%, #ffffff 33.33%, #ffffff 66.66%, #000000 66.66%);
            position: absolute;
            top: 0;
            right: 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        h2 { text-align: center; color: #38bdf8; margin-top: 15px; text-shadow: 0 0 10px rgba(56,189,248,0.3); }
        .sub-header { text-align: center; color: #facc15; font-weight: bold; font-size: 14px; margin-bottom: 20px; }
        .stats-box {
            background: rgba(15, 23, 42, 0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 15px;
        }
        .stats-box span { color: #22c55e; font-weight: bold; font-size: 18px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #334155;
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }
        th { background: rgba(30, 41, 59, 0.95); color: #38bdf8; font-weight: bold; }
        tr:hover { background: rgba(56, 189, 248, 0.05); }
        .ip-badge {
            background: #0f172a;
            color: #38bdf8;
            padding: 5px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #334155;
        }
        .danger-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 25px;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .danger-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="egypt-flag-bar"></div>
    <h2>🇪🇬 غرفة عمليات الأدمن - حدائق القبة</h2>
    <div class="sub-header">متابعة المدارس، أسماء الطلاب، وعناوين الـ IP الحية</div>
    
    <div class="stats-box">
        <div>إجمالي الأصوات: <span id="totalCount">0</span></div>
        <div>المرشح المتصدر: <span id="topCandidate" style="color: #facc15;">--</span></div>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>م</th>
                <th>اسم المدرسة</th>
                <th>اسم الطالب</th>
                <th>المرشح المختار</th>
                <th>عنوان الـ IP</th>
                <th>الوقت</th>
            </tr>
        </thead>
        <tbody id="votesTableBody">
            <!-- ستظهر البيانات هنا تلقائياً -->
        </tbody>
    </table>

    <button class="danger-btn" onclick="clearVotes()">🗑️ تصفير وإفراغ الصناديق</button>
</div>

<script>
function loadAdminData() {
    const votesTableBody = document.getElementById('votesTableBody');
    const totalCount = document.getElementById('totalCount');
    const topCandidate = document.getElementById('topCandidate');
    
    // سحب البيانات من نفس الذاكرة المشتركة المرتبطة بصفحة التصويت
    let votes = JSON.parse(localStorage.getItem('qobbah_cloud_votes')) || [];

    votesTableBody.innerHTML = '';
    totalCount.innerText = votes.length;

    if (votes.length === 0) {
        votesTableBody.innerHTML = '<tr><td colspan="6" style="color: #94a3b8; padding: 25px;">لا توجد أصوات مسجلة حتى الآن.</td></tr>';
        topCandidate.innerText = "لا يوجد";
        return;
    }

    let counts = {};
    votes.forEach(v => { counts[v.candidate] = (counts[v.candidate] || 0) + 1; });
    let best = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
    topCandidate.innerText = best + " (" + counts[best] + " أصوات)";

    votes.forEach((vote, index) => {
        let row = `<tr>
            <td>${index + 1}</td>
            <td style="color: #facc15; font-weight: bold;">${vote.school}</td>
            <td style="font-weight: bold;">${vote.name}</td>
            <td style="color: #38bdf8; font-weight: bold;">${vote.candidate}</td>
            <td><span class="ip-badge">${vote.ipAddress}</span></td>
            <td style="color: #cbd5e1; font-size: 13px;">${vote.time}</td>
        </tr>`;
        votesTableBody.innerHTML += row;
    });
}

function clearVotes() {
    if(confirm('⚠️ هل أنت متأكد من مسح جميع الأصوات؟')) {
        localStorage.removeItem('qobbah_cloud_votes');
        loadAdminData();
    }
}

// تحديث حي لكل الأصوات كل ثانية
setInterval(loadAdminData, 1000);
window.onload = loadAdminData;
</script>

</body>
</html>
